server {
  listen 80;

  # Security headers. Caddy added these where it terminates TLS (QA); on the Mac, Cloudflare
  # terminates TLS and passes responses through untouched, so nginx has to set them itself. Where
  # Caddy sits in front it sets the same names again, replacing these, so nothing is duplicated.
  #
  # `always` sends them on error responses too. HSTS has no includeSubDomains on purpose: the parent
  # domain also carries mail and other sites that this app must not force onto HTTPS.
  #
  # nginx only inherits add_header into a location that declares none of its own; any location
  # below that adds a header must repeat these.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Patient records: never indexed by a search engine, whatever the environment.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /;

    # nginx defaults to 1 MB, which silently 413s most of this app's uploads: photos are accepted
    # up to 10 MB each by the API, and an export POSTs every rendered diagram PNG in one multipart
    # request. The dev server has no such limit, so this only ever fails once deployed.
    client_max_body_size 25m;

    # Building a record PDF — reading images, laying out consent annex pages — takes well over
    # nginx's default 60s read timeout on a Raspberry Pi. Without this the browser gets a 504 while
    # the API is still working, and the export looks broken rather than slow.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The PDF is streamed back as one large body; buffering it to disk first adds latency and, on a
    # Pi with a small SD card, can fail outright.
    proxy_buffering off;
  }

  # Routes that render a PDF. Rendering is CPU-bound and blocks the Node process that runs it, so on
  # the Mac these go to a separate API container (api-pdf) and an export never freezes the rest of
  # the app for other clinics. ${PDF_UPSTREAM} is filled in when the container starts; it defaults
  # to the regular API (see the Dockerfile), so stacks without api-pdf behave exactly as before.
  # A regex location wins over the /api/ prefix above, which is why these need no ^~.
  location ~ ^/api/(patients/[^/]+/export|treatment-items/[^/]+/consent/print)$ {
    proxy_pass http://${PDF_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /;
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  location / {
    root /usr/share/nginx/html;

    # index.html must never be cached. It names the hashed JS bundles, so a stale copy sends the
    # browser after chunk filenames that no longer exist after a deploy. Angular lazy-loads each
    # route, so that failure shows up as a menu entry that does nothing whatsoever — the dynamic
    # import rejects and the router stops without navigating or reporting anything.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # Repeated from the server block: declaring Cache-Control here stops inheritance.
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Real files must 404 when missing rather than falling back to index.html below. Serving HTML
    # in place of a missing .js is what turns a cache mismatch into a silent dead click instead of
    # a visible error in the network tab.
    #
    # Note these are NOT given a long cache: the hashed chunks could be, but assets/i18n/*.json is
    # not hash-named, and caching it hard would make translation changes invisible for as long as
    # the header says.
    location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
      try_files $uri =404;
      error_page 404 @missing_asset;
    }

    # Everything else is a client-side route.
    try_files $uri $uri/ /index.html;
  }

  # A missing chunk is answered with no-store: without a Cache-Control header Cloudflare (and the
  # browser) keep a 404 for a .js for minutes, so the reload that would fix a stale tab after a
  # deploy kept getting the cached 404.
  #
  # Named locations are only valid at server level, never nested in another location: nested,
  # nginx refuses to start ("can be on the server level only") and the whole site answers 502.
  location @missing_asset {
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }
}
