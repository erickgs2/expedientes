server {
  listen 80;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /;

    # nginx defaults to 1 MB, which silently 413s most of this app's uploads: photos are accepted
    # up to 10 MB each by the API, and an export POSTs every rendered diagram PNG in one multipart
    # request. The dev server has no such limit, so this only ever fails once deployed.
    client_max_body_size 25m;

    # Building a record PDF — reading images, laying out consent annex pages — takes well over
    # nginx's default 60s read timeout on a Raspberry Pi. Without this the browser gets a 504 while
    # the API is still working, and the export looks broken rather than slow.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The PDF is streamed back as one large body; buffering it to disk first adds latency and, on a
    # Pi with a small SD card, can fail outright.
    proxy_buffering off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
