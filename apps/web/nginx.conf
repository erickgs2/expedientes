server {
  listen 80;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cookie_path / /;

    # nginx defaults to 1 MB, which silently 413s most of this app's uploads: photos are accepted
    # up to 10 MB each by the API, and an export POSTs every rendered diagram PNG in one multipart
    # request. The dev server has no such limit, so this only ever fails once deployed.
    client_max_body_size 25m;

    # Building a record PDF — reading images, laying out consent annex pages — takes well over
    # nginx's default 60s read timeout on a Raspberry Pi. Without this the browser gets a 504 while
    # the API is still working, and the export looks broken rather than slow.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The PDF is streamed back as one large body; buffering it to disk first adds latency and, on a
    # Pi with a small SD card, can fail outright.
    proxy_buffering off;
  }

  location / {
    root /usr/share/nginx/html;

    # index.html must never be cached. It names the hashed JS bundles, so a stale copy sends the
    # browser after chunk filenames that no longer exist after a deploy. Angular lazy-loads each
    # route, so that failure shows up as a menu entry that does nothing whatsoever — the dynamic
    # import rejects and the router stops without navigating or reporting anything.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Real files must 404 when missing rather than falling back to index.html below. Serving HTML
    # in place of a missing .js is what turns a cache mismatch into a silent dead click instead of
    # a visible error in the network tab.
    #
    # Note these are NOT given a long cache: the hashed chunks could be, but assets/i18n/*.json is
    # not hash-named, and caching it hard would make translation changes invisible for as long as
    # the header says.
    location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
      try_files $uri =404;
    }

    # Everything else is a client-side route.
    try_files $uri $uri/ /index.html;
  }
}
