name: Deploy dev (MacBook server)

# Pushing to `dev` deploys to the MacBook Pro server (Ubuntu Server, x86_64) on the home network.
# It replaced the Raspberry Pi as the deploy target; the Pi keeps running its last deployed version
# and no longer receives deploys.
#
# This runs on a SELF-HOSTED runner on the Mac itself rather than SSHing in from GitHub: the Mac
# sits behind a home router, and a self-hosted runner polls outbound, so no inbound SSH port has to
# be forwarded and no key for the home network is stored in GitHub. The app is published through a
# Cloudflare Tunnel (see docker-compose.mac.yml), so no port is opened for it either.
#
# Setting the server and runner up is documented in docs/deployment/mac-server-runbook.md. The
# runner must carry the labels `self-hosted` and `dev-server`.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  # Two overlapping deploys would race `docker compose up` against the same stack. Queue rather
  # than cancel: cancelling between the migration and the restart would leave a migrated database
  # serving the old containers.
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, dev-server]
    env:
      # Every `docker compose` call needs this, `build` included: compose interpolates the whole
      # file on any command, so the `${VAR:?...}` guards fire before a build would even start.
      COMPOSE: docker compose -f docker-compose.mac.yml --env-file /opt/expedientes/.env
    # A 2011 laptop with 4 GB builds Angular and Next much more slowly than a cloud runner; the
    # default 360-minute cap would let a wedged build sit for hours before anyone noticed.
    timeout-minutes: 60

    steps:
      # `clean: false` keeps node_modules between deploys. The default `git clean -ffdx` deletes
      # it, forcing a full npm ci on every deploy. Tracked files are still reset to the commit.
      - uses: actions/checkout@v4
        with:
          clean: false

      # No actions/setup-node: the runner uses the server's installed Node 22 rather than
      # downloading a toolchain on every deploy. Confirm the version rather than assume it — a mismatch shows up here instead
      # of as a confusing build failure later.
      - name: Show toolchain
        run: |
          node --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Tests run before anything is rebuilt, so a red build never reaches the running stack.
      - name: Test
        run: npx nx test api

      # `--profile tools` matters: without it compose silently skips the profiled `migrate`
      # service, and the deploy then runs migrations from a stale image built weeks ago.
      - name: Build images
        run: $COMPOSE --profile tools build

      - name: Migrate and restart
        run: |
          set -euo pipefail
          # The stack's secrets live in /opt/expedientes/.env on the server and never pass through
          # GitHub. --env-file points at it while the compose file comes from this checkout, so a
          # change to the stack ships with the code that expects it.
          $COMPOSE up -d db
          $COMPOSE --profile tools run --rm migrate
          $COMPOSE up -d --remove-orphans

      - name: Smoke check
        run: |
          set -euo pipefail
          # Probed from the web container rather than from inside api itself, so this exercises the
          # same path nginx uses to reach the API — a server listening only on its own interface
          # would pass a localhost check inside its own container while still being unreachable.
          for i in $(seq 1 15); do
            if $COMPOSE exec -T web wget -q -O /dev/null http://api:3000/api/hello; then
              echo "API healthy"
              exit 0
            fi
            sleep 4
          done
          echo "API did not become healthy" >&2
          $COMPOSE logs --tail=50 api >&2
          exit 1

      # Old images pile up with every deploy, and a full disk is the most likely way this server breaks. `always()`
      # so the cleanup still runs when the smoke check failed and left a half-built image behind.
      - name: Prune old images
        if: always()
        run: docker image prune -f
