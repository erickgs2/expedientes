name: Deploy QA

# Pushing to `qa` deploys. Nothing else triggers this — `main` is deliberately not wired up, so
# merging to main never touches a running environment.
on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  # A second push while a deploy is mid-flight would race two `docker compose up` runs against the
  # same instance. Queue instead, and never cancel: cancelling between the migrate step and the
  # restart would leave a migrated database serving the old image.
  group: deploy-qa
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The Prisma client is generated code the type-check depends on; without this the API build
      # fails on missing model types rather than on anything real.
      - run: npx prisma generate
      - run: npx nx test api
      - run: npx nx build api
      - run: npx nx build web

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three images, all from this repo's existing Dockerfiles:
      #   api      the Next.js standalone server
      #   web      nginx serving the Angular bundle and proxying /api/
      #   migrate  the api image's build stage, which still has the Prisma CLI and the workspace,
      #            used for the one-off `migrate deploy && db seed` job
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_REPO }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: build
          push: true
          tags: ${{ env.IMAGE_REPO }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      # The compose file and Caddyfile are deployed too, so a change to either ships with the code
      # that expects it rather than needing a manual edit on the box.
      - name: Copy stack files to the instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          source: 'docker-compose.qa.yml,deploy/Caddyfile'
          target: /opt/expedientes
          overwrite: true

      - name: Pull, migrate and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          # `set -euo pipefail` matters: without it a failed migration would be ignored and the new
          # image would start against an out-of-date schema.
          script: |
            set -euo pipefail
            cd /opt/expedientes

            # IMAGE_TAG is the only value CI controls; everything else lives in the instance's .env
            # and never passes through GitHub. Rewritten rather than appended so repeated deploys
            # don't accumulate stale lines.
            grep -v '^IMAGE_TAG=' .env > .env.next || true
            echo "IMAGE_TAG=${{ github.sha }}" >> .env.next
            mv .env.next .env

            docker compose -f docker-compose.qa.yml pull
            docker compose -f docker-compose.qa.yml up -d db
            docker compose -f docker-compose.qa.yml --profile tools run --rm migrate
            docker compose -f docker-compose.qa.yml up -d --remove-orphans

            # Images pile up fast on a 2 GiB instance with a small root volume; a full disk is the
            # most likely way this deployment breaks.
            docker image prune -f

      - name: Smoke check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/expedientes
            # Checked from inside the network so this tests the app, not DNS or the certificate.
            # Retried: the API needs a moment to accept connections after a restart.
            for i in $(seq 1 10); do
              if docker compose -f docker-compose.qa.yml exec -T api node -e "fetch('http://localhost:3000/api/hello').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "API healthy"
                exit 0
              fi
              sleep 3
            done
            echo "API did not become healthy" >&2
            docker compose -f docker-compose.qa.yml logs --tail=50 api >&2
            exit 1
